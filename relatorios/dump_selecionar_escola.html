	.combo-container {

		width: 100%;

	}

	.combo-dropdown {
		position: absolute;

		z-index: 9999;

	.combo-item {
		padding: 10px 12px;

	.combo-item.selected {

		font-weight: 600;

	</style><script>
		function abrirComboEmpresa() {
			document.getElementById("comboEmpresaDropdown").style.display = "block";
		}

		function fecharComboEmpresa() {
			document.getElementById("comboEmpresaDropdown").style.display = "none";
		}

		function selecionarEmpresa(valor, texto) {

			const inputTexto = document.getElementById("comboEmpresaInput");
			const hidden     = document.getElementById("cmdEmpresaUsuario");

			if (!inputTexto || !hidden) {
				alert("Erro interno: campos do combo não encontrados na página.");
				return;
			}

			inputTexto.value = texto;
			hidden.value = valor;

			// Remove seleção anterior
			const itens = document.getElementsByClassName("combo-item");
			for (let i = 0; i < itens.length; i++) {
				itens[i].classList.remove("selected");
			}

			// Marca o item atual
			for (let i = 0; i < itens.length; i++) {
				if (itens[i].getAttribute("data-value") == valor) {
					itens[i].classList.add("selected");
					break;
				}
			}

			fecharComboEmpresa();

			// Submete o form
			document.getElementById("frm").submit();
		}


		function filtrarComboEmpresa() {
			const filtro = document.getElementById("comboEmpresaInput").value.toUpperCase();
			const itens = document.getElementsByClassName("combo-item");

			let algumVisivel = false;

			for (let i = 0; i < itens.length; i++) {
				const txt = itens[i].innerText.toUpperCase();

				if (txt.indexOf(filtro) > -1) {
					itens[i].style.display = "";
					algumVisivel = true;
				} else {
					itens[i].style.display = "none";
				}
			}

			document.getElementById("comboEmpresaDropdown").style.display = "block";
		}

		// Fecha ao clicar fora
		document.addEventListener("click", function(event) {
			const combo = document.querySelector(".combo-container");
			if (!combo.contains(event.target)) {
				fecharComboEmpresa();
			}
		});

		document.addEventListener("DOMContentLoaded", function() {

			const hidden = document.getElementById("cmdEmpresaUsuario");
			const input  = document.getElementById("comboEmpresaInput");
			const itens  = document.getElementsByClassName("combo-item");

			if (!hidden || !input) return;

			const valorAtual = hidden.value;

			for (let i = 0; i < itens.length; i++) {
				if (itens[i].getAttribute("data-value") == valorAtual) {

					// Marca visualmente
					itens[i].classList.add("selected");

					// Coloca o TEXTO no input
					input.value = itens[i].textContent.trim();

					// (Opcional) rola até ele
					itens[i].scrollIntoView({ block: "nearest" });

					break;
				}
			}

		});	

	</script><script>
		function abreAtividade(atv_pai, cod_aluno){
			var caminho = "EAD/respostaAtividadeVisualizar_aluno_cad.asp?atv_pai="+atv_pai+"&a="+cod_aluno;
			window.open(caminho,"abreAtividade","top=5,left=5,height=810,width=1000,menubar=no,toolbar=no,scrollbars=yes,status=yes");
		}
		function fecharNotificacao(atv_aluno, cod_aluno){
			var frm = document.getElementById("frm");
			frm.action="fecharNotificacao_cod.asp?atv_aluno="+atv_aluno+"&a="+cod_aluno;
			frm.submit();
		}
		function mostraAtividade(codigo){
			if (document.getElementById("aluno_"+codigo).style.display=="none"){
				document.getElementById("aluno_"+codigo).style.display="table-row"
				document.getElementById("imgDadosAluno_"+codigo).src="http://gemul-aparecida.com.br/images/down.jpg"
			}
			else{
				document.getElementById("aluno_"+codigo).style.display="none"
				document.getElementById("imgDadosAluno_"+codigo).src="http://gemul-aparecida.com.br/images/up.jpg"
			}
		}
		function mostraTodasNotificacoes(){
			var frm = document.getElementById("frm");
			frm.cmdNotificacao.value = "AGUARDE...";
			frm.cmdNotificacao.disabled = true;
			frm.action="selecionar_escola.asp?m=s"
			frm.submit();
		}
		
		function fecharNotificacaoSelecionadas(){
			var frm = document.getElementById("frm");
			
			var selecionado = "N";
			
			for (var i = 0; i < frm.elements.length; i++) {
				if (frm.elements[i].type == "checkbox"){				
					if (frm.elements[i].checked == true)
					{
						selecionado = "S";
					}
				}
			}
			
			if (selecionado == "N"){
				alert("Um ou mais notificações de alunos deverão ser selecionadas!\nMarque a caixa de seleção [ ] que está em frente o nome do aluno.");
				return false
			}
			
			if (confirm("Deseja fechar todas notificações selecionadas?")){
				frm.action="fecharNotificacao_cod.asp";
				frm.submit();
			}
		}
